<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Bravado | AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="villa-theme.css">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(11, 18, 32, 0.92);
      --panel-soft: rgba(255, 255, 255, 0.055);
      --blue: #2f80ff;
      --blue-soft: #77b7ff;
      --text: #f4f8ff;
      --muted: #aab8cc;
      --line: rgba(119, 183, 255, 0.24);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(47, 128, 255, 0.22), transparent 62%),
        radial-gradient(720px 420px at 92% 8%, rgba(119, 183, 255, 0.12), transparent 58%),
        linear-gradient(145deg, #05070b 0%, #0b1220 54%, #06080d 100%);
      color: var(--text);
      overflow: hidden;
    }

    .chat-page {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      padding: clamp(14px, 2.5vw, 28px);
      gap: 16px;
    }

    header {
      width: min(1060px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .lion-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue-soft), var(--blue));
      color: white;
      font-size: 26px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 26px);
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .home-link {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      white-space: nowrap;
      background: rgba(255,255,255,0.04);
    }

    .chat-shell {
      width: min(1060px, 100%);
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: clamp(16px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: min(760px, 88%);
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 15px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--panel-soft);
      border-top-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--blue), #69a9ff);
      color: white;
      border-color: transparent;
      border-top-right-radius: 4px;
    }

    .msg strong { color: var(--blue-soft); }

    .chat-input-area {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
      background: rgba(5, 7, 11, 0.34);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .file-row label {
      cursor: pointer;
      color: var(--blue-soft);
      font-weight: 800;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(5, 7, 11, 0.62);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--blue-soft);
      box-shadow: 0 0 0 3px rgba(47, 128, 255, 0.18);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 22px;
      background: linear-gradient(135deg, var(--blue), #69a9ff);
      color: white;
      font-weight: 800;
      cursor: pointer;
      font: inherit;
      box-shadow: 0 12px 28px rgba(47, 128, 255, 0.24);
    }

    @media (max-width: 640px) {
      body { overflow: auto; }
      .chat-page { min-height: 100vh; height: auto; }
      header { align-items: flex-start; }
      .home-link { padding: 9px 12px; }
      .input-row { flex-direction: column; }
      button { padding: 14px 18px; }
      .msg { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="chat-page">
    <header>
      <div class="brand">
        <div class="lion-mark" aria-hidden="true">&#129409;</div>
        <div>
          <h1>Mr Roar</h1>
          <p>Ask questions, upload notes, or get help studying</p>
        </div>
      </div>
      <a class="home-link" href="index.html">Back to Home</a>
    </header>


    <main class="chat-shell">
      <div class="chat-box" id="chat-box">
        <div class="msg bot"><strong>Mr Roar:</strong><br>Aweh Villaman. Send a question or upload your notes. I can explain work, summarise notes, help plan studying, or break down an assignment.</div>
      </div>

      <div class="chat-input-area">
        <div class="file-row">
          <label for="doc-upload">Attach text notes</label>
          <input type="file" id="doc-upload" accept=".txt,.md,.csv" style="display:none" onchange="handleFile(event)">
          <span id="file-status">No file loaded.</span>
        </div>
        <div class="input-row">
          <input type="text" id="chat-in" placeholder="Type your question here..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button type="button" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    let documentContext = "";

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        documentContext = `\n\n[CONTEXT: The user uploaded '${file.name}'. Text: ${e.target.result.substring(0, 15000)}]`;
        document.getElementById('file-status').innerText = `${file.name} loaded.`;
        addMsg(`Got '${file.name}'. What must we look at first?`, 'bot');
      };
      reader.readAsText(file);
    }

    async function sendMessage() {
      const input = document.getElementById('chat-in');
      const userVal = input.value.trim();
      if (!userVal) return;

      addMsg(userVal, 'user');
      input.value = "";
      addMsg("Thinking...", "bot", "loading-msg");

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userVal,
            documentContext
          })
        });

        const responseText = await response.text();
        let result = {};
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch {
          throw new Error(
            response.status === 404
              ? "The Netlify AI function was not found. Redeploy the full project folder, including netlify/functions/chat.js."
              : "The AI endpoint returned an unreadable response."
          );
        }

        const loading = document.getElementById('loading-msg');
        if (loading) loading.remove();

        if (!response.ok) {
          const detail = result.error || result.message || responseText || `HTTP ${response.status}`;
          addMsg(`I could not connect to the AI service right now. ${detail}`, 'bot');
          return;
        }

        if (result.text) {
          let text = result.text;
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          text = text.replace(/\n/g, '<br>');
          addMsg(text, 'bot');
        } else {
          addMsg("I could not answer that right now. Try again in a moment.", 'bot');
        }
      } catch (err) {
        const loading = document.getElementById('loading-msg');
        if (loading) loading.remove();
        addMsg(err.message || "The connection dropped. Check your internet and try again.", 'bot');
      }
    }

    function addMsg(text, sender, id = null) {
      const box = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      if (id) msgDiv.id = id;
      msgDiv.innerHTML = sender === 'bot' && id !== 'loading-msg' ? `<strong>Mr Roar:</strong><br>${text}` : text;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
